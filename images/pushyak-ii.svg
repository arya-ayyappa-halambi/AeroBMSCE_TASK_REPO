<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="gridPattern2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="blueprintGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#blueprintGrad2)"/>
  <rect width="600" height="400" fill="url(#gridPattern2)"/>

  <!-- Technical Border & Corner Brackets -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#334155" stroke-width="1"/>
  <path d="M 15 35 L 15 15 L 35 15" stroke="#00F0FF" stroke-width="2.5" fill="none"/>
  <path d="M 585 35 L 585 15 L 565 15" stroke="#00F0FF" stroke-width="2.5" fill="none"/>
  <path d="M 15 365 L 15 385 L 35 385" stroke="#00F0FF" stroke-width="2.5" fill="none"/>
  <path d="M 585 365 L 585 385 L 565 385" stroke="#00F0FF" stroke-width="2.5" fill="none"/>

  <text x="30" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1.5">
    AIRFRAME ID: [HGR-02 // PUSHYAK-II]
  </text>
  <text x="570" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8" text-anchor="end">
    CLASS: HYBRID QUAD-PLANE VTOL
  </text>

  <!-- Technical VTOL Schematic -->
  <g transform="translate(300, 195)">
    <!-- Main Swept Wing -->
    <path d="M 0 -70 L 210 25 L 200 45 L 0 10 L -200 45 L -210 25 Z" fill="#13203C" stroke="#00F0FF" stroke-width="2"/>
    
    <!-- Fuselage Body -->
    <path d="M 0 -95 C 18 -95 18 85 0 95 C -18 85 -18 -95 0 -95 Z" fill="#1E293B" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Avionics & Sensor bay -->
    <rect x="-8" y="-35" width="16" height="35" rx="2" fill="#020617" stroke="#00F0FF" stroke-width="1"/>
    <circle cx="0" cy="-20" r="3" fill="#10B981"/>
    <text x="0" y="2" font-family="'JetBrains Mono', monospace" font-size="7" fill="#00F0FF" text-anchor="middle">PIXHAWK 6X</text>

    <!-- Quad VTOL Booms (Carbon Tube) -->
    <rect x="-110" y="-85" width="8" height="170" rx="3" fill="#334155" stroke="#94A3B8" stroke-width="1"/>
    <rect x="102" y="-85" width="8" height="170" rx="3" fill="#334155" stroke="#94A3B8" stroke-width="1"/>

    <!-- 4x VTOL Rotors -->
    <!-- Front Left -->
    <circle cx="-106" cy="-85" r="32" stroke="#FF5722" stroke-width="1.2" stroke-dasharray="3 3" fill="#FF5722" fill-opacity="0.1"/>
    <circle cx="-106" cy="-85" r="4" fill="#FF5722"/>
    <!-- Front Right -->
    <circle cx="106" cy="-85" r="32" stroke="#FF5722" stroke-width="1.2" stroke-dasharray="3 3" fill="#FF5722" fill-opacity="0.1"/>
    <circle cx="106" cy="-85" r="4" fill="#FF5722"/>
    <!-- Rear Left -->
    <circle cx="-106" cy="85" r="32" stroke="#FF5722" stroke-width="1.2" stroke-dasharray="3 3" fill="#FF5722" fill-opacity="0.1"/>
    <circle cx="-106" cy="85" r="4" fill="#FF5722"/>
    <!-- Rear Right -->
    <circle cx="106" cy="85" r="32" stroke="#FF5722" stroke-width="1.2" stroke-dasharray="3 3" fill="#FF5722" fill-opacity="0.1"/>
    <circle cx="106" cy="85" r="4" fill="#FF5722"/>

    <!-- Forward Pusher Motor at Tail -->
    <ellipse cx="0" cy="98" rx="6" ry="3" fill="#64748B" stroke="#00F0FF" stroke-width="1.5"/>
    <path d="M -30 102 Q 0 105 30 102" stroke="#00F0FF" stroke-width="2"/>

    <!-- Wingtip Winglets -->
    <polygon points="-210,18 -200,45 -215,42" fill="#FF5722"/>
    <polygon points="210,18 200,45 215,42" fill="#FF5722"/>
  </g>

  <!-- Spec Footer -->
  <g transform="translate(30, 315)">
    <rect width="540" height="52" rx="3" fill="#050B18" stroke="#1E293B" stroke-width="1"/>
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">WINGSPAN</text>
    <text x="18" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">1,800 MM</text>

    <text x="115" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">ENDURANCE</text>
    <text x="115" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10B981">68 MINS</text>

    <text x="220" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">CRUISE SPEED</text>
    <text x="220" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00F0FF">72 KM/H</text>

    <text x="340" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">AVIONICS</text>
    <text x="340" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">ArduPlane Q-VTOL</text>

    <text x="475" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">TAKEOFF MODE</text>
    <text x="475" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FF5722">ZERO RUNWAY</text>
  </g>
</svg>
