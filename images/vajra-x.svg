<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="gridPattern3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="blueprintGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080E"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#blueprintGrad3)"/>
  <rect width="600" height="400" fill="url(#gridPattern3)"/>

  <!-- Border & Brackets -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#334155" stroke-width="1"/>
  <path d="M 15 35 L 15 15 L 35 15" stroke="#FF5722" stroke-width="2.5" fill="none"/>
  <path d="M 585 35 L 585 15 L 565 15" stroke="#FF5722" stroke-width="2.5" fill="none"/>
  <path d="M 15 365 L 15 385 L 35 385" stroke="#FF5722" stroke-width="2.5" fill="none"/>
  <path d="M 585 365 L 585 385 L 565 385" stroke="#FF5722" stroke-width="2.5" fill="none"/>

  <text x="30" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF5722" letter-spacing="1.5">
    AIRFRAME ID: [HGR-03 // VAJRA-X]
  </text>
  <text x="570" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8" text-anchor="end">
    CLASS: HIGH-G DELTA RACER &amp; AEROBATICS
  </text>

  <!-- Delta Wing Interceptor Wireframe Schematic -->
  <g transform="translate(300, 195)">
    <!-- Aerodynamic Shock Cone -->
    <path d="M 0 -130 L 120 70 L 60 70 L 20 80 L 0 75 L -20 80 L -60 70 L -120 70 Z" fill="#180C14" stroke="#FF5722" stroke-width="2"/>

    <!-- Wing Spars & Rib Lattice -->
    <line x1="0" y1="-100" x2="90" y2="60" stroke="#FF5722" stroke-width="0.8" stroke-dasharray="4 2"/>
    <line x1="0" y1="-100" x2="-90" y2="60" stroke="#FF5722" stroke-width="0.8" stroke-dasharray="4 2"/>
    <line x1="0" y1="-60" x2="60" y2="60" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="0" y1="-60" x2="-60" y2="60" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Canard Foreplanes -->
    <polygon points="0,-75 45,-60 15,-52" fill="#00F0FF" opacity="0.8"/>
    <polygon points="0,-75 -45,-60 -15,-52" fill="#00F0FF" opacity="0.8"/>

    <!-- Canopy / Cockpit Spine -->
    <path d="M 0 -95 Q 8 -40 6 30 L -6 30 Q -8 -40 0 -95 Z" fill="#00F0FF" opacity="0.6"/>

    <!-- Twin Canted Vertical Stabilizers -->
    <polygon points="40,20 48,70 34,70" fill="#FF5722"/>
    <polygon points="-40,20 -48,70 -34,70" fill="#FF5722"/>

    <!-- Elevons -->
    <line x1="60" y1="65" x2="115" y2="65" stroke="#00F0FF" stroke-width="3"/>
    <line x1="-60" y1="65" x2="-115" y2="65" stroke="#00F0FF" stroke-width="3"/>

    <!-- High-power Afterburner / EDF Thrust Nozzle -->
    <circle cx="0" cy="80" r="14" fill="#050811" stroke="#FF5722" stroke-width="2"/>
    <circle cx="0" cy="80" r="8" fill="#FF5722" opacity="0.8"/>
    <line x1="0" y1="94" x2="0" y2="125" stroke="#FF5722" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="0" y="138" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#FF5722" text-anchor="middle">THRUST VECTOR NOZZLE</text>
  </g>

  <!-- Specs Bottom Overlay -->
  <g transform="translate(30, 315)">
    <rect width="540" height="52" rx="3" fill="#050B18" stroke="#1E293B" stroke-width="1"/>
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">MAX VELOCITY</text>
    <text x="18" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FF5722">165 KM/H (90 KTS)</text>

    <text x="135" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">MAX LOAD FACTOR</text>
    <text x="135" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">+9.5G / -4.2G</text>

    <text x="250" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">AIRFRAME STRUCTURE</text>
    <text x="250" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF">3K Carbon Monocoque</text>

    <text x="390" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">ROLL RATE</text>
    <text x="390" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10B981">420° / SEC</text>

    <text x="480" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">T/W RATIO</text>
    <text x="480" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FF5722">2.4 : 1</text>
  </g>
</svg>
