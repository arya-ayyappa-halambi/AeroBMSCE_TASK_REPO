<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="gridPattern6" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="cfdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#060A13"/>
  <rect width="600" height="400" fill="url(#gridPattern6)"/>

  <!-- Brackets -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#334155" stroke-width="1"/>
  <path d="M 15 35 L 15 15 L 35 15" stroke="#FF5722" stroke-width="2.5" fill="none"/>
  <path d="M 585 35 L 585 15 L 565 15" stroke="#FF5722" stroke-width="2.5" fill="none"/>
  <path d="M 15 365 L 15 385 L 35 385" stroke="#FF5722" stroke-width="2.5" fill="none"/>
  <path d="M 585 365 L 585 385 L 565 385" stroke="#FF5722" stroke-width="2.5" fill="none"/>

  <text x="30" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1.5">
    AERODYNAMIC COMPUTATIONAL WIND TUNNEL // NACA-4412 AIRFOIL
  </text>
  <text x="570" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8" text-anchor="end">
    REYNOLDS NO: Re = 3.5 × 10⁵ // α = 5.2°
  </text>

  <!-- Airflow Streamlines -->
  <g stroke-linecap="round" opacity="0.85">
    <!-- Upper Streamlines (Accelerated flow, Low Pressure / Suction Peak) -->
    <path d="M 20 100 C 180 95, 230 65, 300 80 C 370 95, 480 120, 580 120" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="6 3"/>
    <path d="M 20 125 C 170 120, 220 90, 300 105 C 380 120, 480 140, 580 140" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 4"/>
    <path d="M 20 150 C 160 145, 210 125, 300 135 C 390 145, 480 160, 580 160" stroke="#60A5FA" stroke-width="2"/>
    <path d="M 20 175 C 160 175, 210 165, 300 172 C 390 180, 480 185, 580 185" stroke="#93C5FD" stroke-width="1.5"/>

    <!-- Airfoil Section (NACA Camber Profile) -->
    <path d="M 180 200 C 220 150, 360 170, 460 215 C 360 225, 240 225, 180 200 Z" fill="#1E293B" stroke="#FF5722" stroke-width="3"/>

    <!-- Lower Streamlines (High Pressure Stagnation Region) -->
    <path d="M 20 220 C 160 220, 220 235, 300 230 C 380 225, 480 215, 580 210" stroke="#FF8A65" stroke-width="2"/>
    <path d="M 20 245 C 160 245, 220 260, 300 255 C 380 250, 480 240, 580 235" stroke="#FF7043" stroke-width="1.8" stroke-dasharray="8 4"/>
    <path d="M 20 270 C 160 270, 220 285, 300 280 C 380 275, 480 265, 580 260" stroke="#F4511E" stroke-width="1.5" stroke-dasharray="6 3"/>
  </g>

  <!-- Aerodynamic Vector Arrows: Lift (L) and Drag (D) -->
  <g transform="translate(290, 190)">
    <!-- Lift Vector (Perpendicular to relative wind) -->
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#00F0FF" stroke-width="3"/>
    <polygon points="-6,-88 0,-102 6,-88" fill="#00F0FF"/>
    <text x="12" y="-75" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00F0FF">LIFT (L = 48.6 N)</text>

    <!-- Drag Vector (Parallel to relative wind) -->
    <line x1="0" y1="0" x2="65" y2="0" stroke="#FF5722" stroke-width="2.5"/>
    <polygon points="63,-6 77,0 63,6" fill="#FF5722"/>
    <text x="35" y="-10" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF5722">DRAG (D = 3.9 N)</text>

    <!-- Resultant Force Vector -->
    <line x1="0" y1="0" x2="65" y2="-90" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="70" y="-88" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FBBF24">R (L/D = 12.46)</text>
  </g>

  <!-- Technical Readout Panel at bottom -->
  <g transform="translate(30, 315)">
    <rect width="540" height="52" rx="3" fill="#050B18" stroke="#1E293B" stroke-width="1"/>
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">LIFT COEFFICIENT (CL)</text>
    <text x="18" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00F0FF">1.242</text>

    <text x="160" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">DRAG COEFFICIENT (CD)</text>
    <text x="160" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FF5722">0.099</text>

    <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">STALL MARGIN</text>
    <text x="300" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10B981">+9.8° UNTIL SEPARATION</text>

    <text x="440" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">PRESSURE PEAK (CP MIN)</text>
    <text x="440" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F59E0B">-2.84 CP</text>
  </g>
</svg>
