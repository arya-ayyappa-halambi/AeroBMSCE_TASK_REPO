<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="gridPattern1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="blueprintGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background Blueprint Canvas -->
  <rect width="600" height="400" fill="url(#blueprintGrad1)"/>
  <rect width="600" height="400" fill="url(#gridPattern1)"/>

  <!-- Technical Border & Corner Brackets -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#334155" stroke-width="1"/>
  <path d="M 15 35 L 15 15 L 35 15" stroke="#FF5722" stroke-width="2.5" fill="none"/>
  <path d="M 585 35 L 585 15 L 565 15" stroke="#FF5722" stroke-width="2.5" fill="none"/>
  <path d="M 15 365 L 15 385 L 35 385" stroke="#FF5722" stroke-width="2.5" fill="none"/>
  <path d="M 585 365 L 585 385 L 565 385" stroke="#FF5722" stroke-width="2.5" fill="none"/>

  <!-- Top Metadata Bar -->
  <text x="30" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1.5">
    AIRFRAME ID: [HGR-01 // GARUDA-IV]
  </text>
  <text x="570" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8" text-anchor="end">
    CLASS: SAE HEAVY-LIFT CARGO
  </text>

  <!-- Technical Orthographic Projection / 3-View Schematic of Garuda IV -->
  <g transform="translate(300, 195)">
    <!-- Center of Gravity Marker (CG) -->
    <circle cx="0" cy="10" r="14" stroke="#FF5722" stroke-width="1.5" fill="none"/>
    <path d="M 0 -4 L 0 24 M -14 10 L 14 10" stroke="#FF5722" stroke-width="1.5"/>
    <path d="M 0 10 A 10 10 0 0 1 10 20 L 0 20 Z" fill="#FF5722" opacity="0.6"/>
    <path d="M 0 10 A 10 10 0 0 1 -10 0 L 0 0 Z" fill="#FF5722" opacity="0.6"/>
    <text x="18" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF5722">CG: 28% MAC</text>

    <!-- Main High-Lift Wing (Selig 1223 High-Lift Airfoil Planform) -->
    <path d="M -240 -15 L 240 -15 L 235 25 L -235 25 Z" fill="#0B132B" stroke="#00F0FF" stroke-width="2"/>
    <!-- Wing Rib Stations -->
    <line x1="-200" y1="-15" x2="-196" y2="25" stroke="#00F0FF" stroke-width="0.75" stroke-dasharray="3 3"/>
    <line x1="-150" y1="-15" x2="-147" y2="25" stroke="#00F0FF" stroke-width="0.75" stroke-dasharray="3 3"/>
    <line x1="-100" y1="-15" x2="-98" y2="25" stroke="#00F0FF" stroke-width="0.75" stroke-dasharray="3 3"/>
    <line x1="-50" y1="-15" x2="-49" y2="25" stroke="#00F0FF" stroke-width="0.75" stroke-dasharray="3 3"/>
    <line x1="50" y1="-15" x2="49" y2="25" stroke="#00F0FF" stroke-width="0.75" stroke-dasharray="3 3"/>
    <line x1="100" y1="-15" x2="98" y2="25" stroke="#00F0FF" stroke-width="0.75" stroke-dasharray="3 3"/>
    <line x1="150" y1="-15" x2="147" y2="25" stroke="#00F0FF" stroke-width="0.75" stroke-dasharray="3 3"/>
    <line x1="200" y1="-15" x2="196" y2="25" stroke="#00F0FF" stroke-width="0.75" stroke-dasharray="3 3"/>

    <!-- Wing Tip Endplates / Vortex Diffusers -->
    <rect x="-244" y="-22" width="6" height="52" rx="2" fill="#FF5722" stroke="#FF8A65" stroke-width="1"/>
    <rect x="238" y="-22" width="6" height="52" rx="2" fill="#FF5722" stroke="#FF8A65" stroke-width="1"/>

    <!-- Fuselage Centerline Pod (Carbon-fiber monocoque) -->
    <path d="M -22 -75 Q 0 -95 22 -75 L 20 65 Q 0 75 -20 65 Z" fill="#1E293B" stroke="#F8FAFC" stroke-width="1.8"/>
    <!-- Internal Payload Bay Hatch -->
    <rect x="-14" y="-30" width="28" height="60" rx="3" fill="#334155" stroke="#FF5722" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#FFD54F" text-anchor="middle">PAYLOAD BAY</text>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="7" fill="#94A3B8" text-anchor="middle">5.8 KG STEEL</text>

    <!-- Tractor Motor & Propeller -->
    <ellipse cx="0" cy="-78" rx="8" ry="4" fill="#64748B" stroke="#00F0FF" stroke-width="1.5"/>
    <path d="M -45 -82 Q 0 -85 45 -82 Q 0 -79 -45 -82 Z" fill="#00F0FF" opacity="0.7"/>

    <!-- Twin Tailbooms -->
    <line x1="-80" y1="20" x2="-80" y2="120" stroke="#94A3B8" stroke-width="3"/>
    <line x1="80" y1="20" x2="80" y2="120" stroke="#94A3B8" stroke-width="3"/>

    <!-- Horizontal Stabilizer & Twin Vertical Fins -->
    <rect x="-95" y="115" width="190" height="18" rx="2" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5"/>
    <!-- Left vertical fin -->
    <rect x="-92" y="95" width="8" height="42" rx="2" fill="#FF5722" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Right vertical fin -->
    <rect x="84" y="95" width="8" height="42" rx="2" fill="#FF5722" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Dimension Callout Lines -->
    <!-- Wingspan 2.45m -->
    <line x1="-240" y1="-45" x2="240" y2="-45" stroke="#FF5722" stroke-width="1"/>
    <line x1="-240" y1="-52" x2="-240" y2="-38" stroke="#FF5722" stroke-width="1.5"/>
    <line x1="240" y1="-52" x2="240" y2="-38" stroke="#FF5722" stroke-width="1.5"/>
    <text x="0" y="-50" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FF5722" text-anchor="middle">SPAN: 2,450 MM (8.03 FT)</text>
  </g>

  <!-- Flight Spec Matrix Bottom Overlay -->
  <g transform="translate(30, 315)">
    <rect width="540" height="52" rx="3" fill="#050B18" stroke="#1E293B" stroke-width="1"/>
    
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">MTOW</text>
    <text x="18" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">10.2 KG</text>

    <text x="110" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">EMPTY WEIGHT</text>
    <text x="110" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00F0FF">4.4 KG</text>

    <text x="220" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">PAYLOAD FRACTION</text>
    <text x="220" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FF5722">56.8% (5.8 KG)</text>

    <text x="360" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">PROPULSION</text>
    <text x="360" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">Sunnysky 4120 400KV</text>

    <text x="475" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">THRUST/WEIGHT</text>
    <text x="475" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10B981">0.82 T/W</text>
  </g>
</svg>
