<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" fill="none">
  <!-- Grid background subtle -->
  <defs>
    <linearGradient id="aeroOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>
    <linearGradient id="hudCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0088AA"/>
    </linearGradient>
  </defs>

  <!-- Flight Wing Symbol -->
  <g transform="translate(15, 10)">
    <!-- Radar ring -->
    <circle cx="50" cy="50" r="46" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
    <circle cx="50" cy="50" r="34" stroke="#334155" stroke-width="1" opacity="0.6"/>
    <!-- Crosshairs -->
    <line x1="50" y1="2" x2="50" y2="14" stroke="#00F0FF" stroke-width="2"/>
    <line x1="50" y1="86" x2="50" y2="98" stroke="#00F0FF" stroke-width="2"/>
    <line x1="2" y1="50" x2="14" y2="50" stroke="#00F0FF" stroke-width="2"/>
    <line x1="86" y1="50" x2="98" y2="50" stroke="#00F0FF" stroke-width="2"/>
    
    <!-- Supersonic Delta Wing Silhouette -->
    <path d="M50 14 L82 78 L50 64 L18 78 Z" fill="url(#aeroOrangeGrad)" opacity="0.9"/>
    <!-- Fuselage & Canopy Centerline -->
    <path d="M50 14 L53 58 L50 64 L47 58 Z" fill="#FFFFFF"/>
    <!-- Canards / Leading edge vortex slats -->
    <path d="M50 38 L66 52 L50 48 L34 52 Z" fill="#00F0FF" opacity="0.8"/>
    <!-- Thrust vector exhaust plume -->
    <polygon points="46,65 54,65 50,76" fill="#00F0FF" opacity="0.75"/>
  </g>

  <!-- Typography -->
  <text x="135" y="52" font-family="'Rajdhani', 'Chakra Petch', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="#FFFFFF">
    AERO<tspan fill="#FF5722">BMSCE</tspan>
  </text>
  <text x="136" y="74" font-family="'JetBrains Mono', 'Space Mono', monospace" font-size="11" font-weight="700" letter-spacing="4" fill="#00F0FF" opacity="0.9">
    AEROMODELLING &amp; UAV CLUB
  </text>
  <text x="136" y="92" font-family="'JetBrains Mono', 'Space Mono', monospace" font-size="9.5" font-weight="500" letter-spacing="2" fill="#94A3B8">
    B.M.S. COLLEGE OF ENGINEERING // EST. 1946
  </text>

  <!-- Technical Telemetry Corner Marks -->
  <path d="M380 20 L395 20 L395 35" stroke="#FF5722" stroke-width="1.5" fill="none" opacity="0.8"/>
  <text x="395" y="50" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FF5722" text-anchor="end" opacity="0.8">CALLSIGN: VAYU-01</text>
  <text x="395" y="62" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B" text-anchor="end">SYS: NOMINAL</text>
</svg>
